name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy to Production
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t updraftedprod:latest .

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and Trigger Coolify CLI
        run: |
          npm i -g coolify-cli
          coolify deployment trigger --app_id "$APP_ID" --token "$TOKEN" --url "http://localhost:8000"
        env:
          APP_ID: ${{ secrets.COOLIFY_PROD_APP_ID }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}