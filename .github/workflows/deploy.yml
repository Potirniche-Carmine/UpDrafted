name: Deploy to Production and Development

on:
  push:
    branches:
      - main
      - dev

jobs:
  deploy-production:
    name: Build and Deploy to Production
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        env:
          ENV_FILE_PATH: ${{ secrets.PROD_ENV_FILE_PATH }}
        run: |
          # Verify environment file exists
          if [ ! -f "$ENV_FILE_PATH" ]; then
            echo "Error: Environment file not found at $ENV_FILE_PATH"
            exit 1
          fi
          
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/updraftedprod
          IMAGE_ID=$(echo $IMAGE_ID | tr '[:upper:]' '[:lower:]')
          
          # Build with single env file secret
          DOCKER_BUILDKIT=1 docker build \
            --secret id=env_file,src="$ENV_FILE_PATH" \
            -t $IMAGE_ID:latest .
          
          docker push $IMAGE_ID:latest
          
      - name: Trigger Coolify Production Deployment
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"

  deploy-development:
    name: Build and Deploy to Development
    runs-on: self-hosted
    if: github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        env:
          ENV_FILE_PATH: ${{ secrets.DEV_ENV_FILE_PATH }}
        run: |
          # Verify environment file exists
          if [ ! -f "$ENV_FILE_PATH" ]; then
            echo "Error: Environment file not found at $ENV_FILE_PATH"
            exit 1
          fi
          
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/updrafteddev
          IMAGE_ID=$(echo $IMAGE_ID | tr '[:upper:]' '[:lower:]')
          
          # Build with single env file secret
          DOCKER_BUILDKIT=1 docker build \
            -f dockerfile.dev \
            --secret id=env_file,src="$ENV_FILE_PATH" \
            -t $IMAGE_ID:latest .
          
          docker push $IMAGE_ID:latest
          
      - name: Trigger Coolify Development Deployment
        run: |
          curl -X POST "${{ secrets.COOLIFY_DEV_WEBHOOK_URL }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_DEV_TOKEN }}"