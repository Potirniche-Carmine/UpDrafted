name: Deploy to Production

on:
  push:
    branches:
      - main 

jobs:
  deploy-production:
    name: Build and Deploy to Production
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t updraftedprod:latest .

      - name: Trigger Coolify Production Deployment
        uses: garygrossgarten/github-action-trigger-coolify-deployment@v2
        with:
          coolify_url: 'http://localhost:8000'
          app_id: ${{ secrets.COOLIFY_PROD_APP_ID }}
          token: ${{ secrets.COOLIFY_TOKEN }}